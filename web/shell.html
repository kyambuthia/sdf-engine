<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SDF Engine — C++ / SDL3 / WebGL2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    .hud {
      position: fixed;
      top: 14px;
      left: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: rgba(13, 17, 23, 0.72);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 8px 12px;
      z-index: 10;
    }
    .hud button {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .hud button:hover { background: #30363d; }
    .hud button.active { background: #1f6feb; border-color: #58a6ff; }
    .hint {
      position: fixed;
      bottom: 12px;
      left: 14px;
      font-size: 12px;
      color: rgba(230, 237, 243, 0.75);
      background: rgba(13, 17, 23, 0.6);
      padding: 6px 10px;
      border-radius: 6px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hud">
    <strong>SDF Engine</strong>
    <button class="scene-btn active" onclick="setScene(0, this)">1: Smooth Blend</button>
    <button class="scene-btn" onclick="setScene(1, this)">2: CSG Booleans</button>
    <button class="scene-btn" onclick="setScene(2, this)">3: Infinite Repeat</button>
    <button class="scene-btn" onclick="setScene(3, this)">4: Pillars</button>
    <button onclick="Module.ccall(sdf_toggle_pause, null, [], [])">Pause (Space)</button>
    <button onclick="Module.ccall(sdf_reset_camera, null, [], [])">Reset (R)</button>
  </div>
  <div class="hint">Drag to orbit • Scroll / +/- to zoom • Keys 1–4 switch scenes</div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <script>
    function setScene(idx, btn) {
      document.querySelectorAll(.scene-btn).forEach(b => b.classList.remove(active));
      if (btn) btn.classList.add(active);
      if (typeof Module !== undefined && Module.ccall) {
        Module.ccall(sdf_set_scene, null, [number], [idx]);
      }
    }
    var Module = {
      canvas: document.getElementById(canvas)
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
