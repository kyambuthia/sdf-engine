<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SDF // ES3</title>
  <style>
    :root {
      --bg: #0a0c10;
      --panel: rgba(10, 12, 16, 0.88);
      --border: #232832;
      --border-hi: #3b4454;
      --text: #d6dce5;
      --muted: #6e7889;
      --accent: #e6edf3;
      --active-bg: #1c222d;
      --ok: #4ade80;
      --warn: #fbbf24;
      --bad: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .bar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
      z-index: 10;
    }

    .cluster {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .box {
      display: inline-flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .brand {
      padding: 7px 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent);
      border-right: 1px solid var(--border);
    }

    .stat {
      padding: 7px 10px;
      font-variant-numeric: tabular-nums;
      color: var(--ok);
      letter-spacing: 0.04em;
    }

    .label {
      padding: 7px 8px;
      color: var(--muted);
      letter-spacing: 0.08em;
      border-right: 1px solid var(--border);
      user-select: none;
    }

    button {
      appearance: none;
      background: transparent;
      color: var(--muted);
      border: 0;
      border-right: 1px solid var(--border);
      padding: 7px 10px;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: color 0.1s ease, background 0.1s ease;
    }

    button:last-child {
      border-right: 0;
    }

    button:hover {
      color: var(--accent);
      background: rgba(255, 255, 255, 0.04);
    }

    button.active {
      color: var(--accent);
      background: var(--active-bg);
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .foot {
      position: fixed;
      bottom: 12px;
      left: 12px;
      padding: 6px 9px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.07em;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="cluster">
      <div class="box">
        <span class="brand">SDF // ES3</span>
        <span class="stat" id="fps">--.- FPS</span>
      </div>

      <div class="box">
        <span class="label">SCENE</span>
        <button class="scene-btn active" onclick="setScene(0, this)">01 BLEND</button>
        <button class="scene-btn" onclick="setScene(1, this)">02 CSG</button>
        <button class="scene-btn" onclick="setScene(2, this)">03 REPEAT</button>
        <button class="scene-btn" onclick="setScene(3, this)">04 PILLARS</button>
      </div>
    </div>

    <div class="cluster">
      <div class="box">
        <span class="label">RES</span>
        <button class="res-btn" onclick="setRes(0.5, this)">0.5X</button>
        <button class="res-btn active" onclick="setRes(0.75, this)">0.75X</button>
        <button class="res-btn" onclick="setRes(1.0, this)">1.0X</button>
      </div>

      <div class="box">
        <span class="label">QUAL</span>
        <button class="qual-btn" onclick="setQual(0, this)">FAST</button>
        <button class="qual-btn active" onclick="setQual(1, this)">HIGH</button>
      </div>

      <div class="box">
        <button id="pause-btn" onclick="togglePause(this)">PAUSE</button>
        <button onclick="Module.ccall('sdf_reset_camera', null, [], [])">RESET</button>
      </div>
    </div>
  </div>

  <div class="foot">DRAG ORBIT · SCROLL ZOOM · 1-4 SCENE · SPACE PAUSE · R RESET</div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <script>
    function setScene(idx, btn) {
      document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      if (typeof Module !== 'undefined' && Module.ccall) {
        Module.ccall('sdf_set_scene', null, ['number'], [idx]);
      }
    }

    function setRes(scale, btn) {
      document.querySelectorAll('.res-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      if (typeof Module !== 'undefined' && Module.ccall) {
        Module.ccall('sdf_set_res_scale', null, ['number'], [scale]);
      }
    }

    function setQual(q, btn) {
      document.querySelectorAll('.qual-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      if (typeof Module !== 'undefined' && Module.ccall) {
        Module.ccall('sdf_set_quality', null, ['number'], [q]);
      }
    }

    function togglePause(btn) {
      btn.classList.toggle('active');
      if (typeof Module !== 'undefined' && Module.ccall) {
        Module.ccall('sdf_toggle_pause', null, [], []);
      }
    }

    window.addEventListener('keydown', function(e) {
      if (e.key >= '1' && e.key <= '4') {
        var btns = document.querySelectorAll('.scene-btn');
        var idx = parseInt(e.key, 10) - 1;
        document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
        if (btns[idx]) btns[idx].classList.add('active');
      } else if (e.code === 'Space') {
        var pb = document.getElementById('pause-btn');
        if (pb) pb.classList.toggle('active');
      }
    });

    var Module = {
      canvas: document.getElementById('canvas'),
      onRuntimeInitialized: function() {
        setInterval(function() {
          if (Module.ccall) {
            var fps = Module.ccall('sdf_get_fps', 'number', [], []);
            var el = document.getElementById('fps');
            if (el && fps > 0) {
              var ms = (1000.0 / fps).toFixed(1);
              el.textContent = fps.toFixed(1) + ' FPS · ' + ms + 'MS';
              el.style.color = fps >= 50 ? 'var(--ok)' : (fps >= 24 ? 'var(--warn)' : 'var(--bad)');
            }
          }
        }, 500);
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
