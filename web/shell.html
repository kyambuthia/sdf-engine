<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SDF // ES3</title>
  <style>
    :root {
      --bg: #0a0c10;
      --panel: rgba(10, 12, 16, 0.88);
      --border: #232832;
      --text: #d6dce5;
      --muted: #6e7889;
      --accent: #e6edf3;
      --active-bg: #1c222d;
      --ok: #4ade80;
      --warn: #fbbf24;
      --bad: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .bar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
      z-index: 10;
    }

    .cluster {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .box {
      display: inline-flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .brand {
      padding: 7px 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent);
      border-right: 1px solid var(--border);
    }

    .stat {
      padding: 7px 10px;
      font-variant-numeric: tabular-nums;
      color: var(--ok);
      letter-spacing: 0.04em;
    }

    .label {
      padding: 7px 8px;
      color: var(--muted);
      letter-spacing: 0.08em;
      border-right: 1px solid var(--border);
      user-select: none;
    }

    button {
      appearance: none;
      background: transparent;
      color: var(--muted);
      border: 0;
      border-right: 1px solid var(--border);
      padding: 7px 10px;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: color 0.1s ease, background 0.1s ease;
    }

    button:last-child { border-right: 0; }
    button:hover { color: var(--accent); background: rgba(255, 255, 255, 0.04); }
    button.active {
      color: var(--accent);
      background: var(--active-bg);
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .drawer {
      position: fixed;
      top: 52px;
      right: 12px;
      width: 256px;
      background: var(--panel);
      border: 1px solid var(--border);
      z-index: 10;
      display: none;
    }
    .drawer.open { display: block; }

    .sec-head {
      padding: 7px 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent);
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }

    .row {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }
    .row:last-child { border-bottom: 0; }

    .row-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    .row-head span:last-child {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      background: var(--border);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      background: var(--accent);
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: 0;
      border-radius: 0;
      background: var(--accent);
      cursor: pointer;
    }

    .grid-5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border: 1px solid var(--border);
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--border);
    }
    .grid-5 button, .grid-4 button {
      padding: 6px 2px;
      font-size: 10px;
      text-align: center;
    }

    .foot {
      position: fixed;
      bottom: 12px;
      left: 12px;
      padding: 6px 9px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.07em;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="cluster">
      <div class="box">
        <span class="brand">SDF // ES3</span>
        <span class="stat" id="fps">--.- FPS</span>
      </div>

      <div class="box">
        <span class="label">SCENE</span>
        <button class="scene-btn active" onclick="setScene(0, this)">01 BLEND</button>
        <button class="scene-btn" onclick="setScene(1, this)">02 CSG</button>
        <button class="scene-btn" onclick="setScene(2, this)">03 REPEAT</button>
        <button class="scene-btn" onclick="setScene(3, this)">04 PILLARS</button>
      </div>
    </div>

    <div class="cluster">
      <div class="box">
        <span class="label">RES</span>
        <button class="res-btn" onclick="setRes(0.5, this)">0.5X</button>
        <button class="res-btn active" onclick="setRes(0.75, this)">0.75X</button>
        <button class="res-btn" onclick="setRes(1.0, this)">1.0X</button>
      </div>

      <div class="box">
        <span class="label">QUAL</span>
        <button class="qual-btn" onclick="setQual(0, this)">FAST</button>
        <button class="qual-btn active" onclick="setQual(1, this)">HIGH</button>
      </div>

      <div class="box">
        <button id="hud2d-btn" class="active" onclick="toggle2d(this)">2D SDF</button>
        <button id="params-btn" onclick="toggleParams(this)">INSPECT</button>
        <button id="pause-btn" onclick="togglePause(this)">PAUSE</button>
        <button onclick="resetAll()">RESET</button>
      </div>
    </div>
  </div>

  <div class="drawer" id="params-drawer">
    <div class="sec-head"><span>GLOBAL PARAMS</span><span id="node-count">0 NODES</span></div>
    <div class="row">
      <div class="row-head"><span>BLEND K</span><span id="val-blend">0.45</span></div>
      <input type="range" min="0.01" max="1.20" step="0.01" value="0.45" oninput="setBlend(this.value)" />
    </div>
    <div class="row">
      <div class="row-head"><span>SPEED</span><span id="val-speed">1.00</span></div>
      <input type="range" min="0.00" max="3.00" step="0.05" value="1.00" oninput="setSpeed(this.value)" />
    </div>
    <div class="row">
      <div class="row-head"><span>SHADOW</span><span id="val-shadow">1.00</span></div>
      <input type="range" min="0.00" max="1.00" step="0.05" value="1.00" oninput="setShadow(this.value)" />
    </div>
    <div class="row">
      <div class="row-head"><span>FOG</span><span id="val-fog">1.80</span></div>
      <input type="range" min="0.00" max="8.00" step="0.10" value="1.80" oninput="setFog(this.value)" />
    </div>
    <div class="row">
      <div class="row-head"><span>BOOL OP</span><span>OVERRIDE</span></div>
      <div class="grid-5">
        <button class="op-btn active" onclick="setOp(-1, this)">AUTO</button>
        <button class="op-btn" onclick="setOp(3, this)">SMIN</button>
        <button class="op-btn" onclick="setOp(0, this)">UNI</button>
        <button class="op-btn" onclick="setOp(1, this)">SUB</button>
        <button class="op-btn" onclick="setOp(2, this)">INT</button>
      </div>
    </div>

    <div class="sec-head"><span>NODE INSPECTOR</span><span id="sel-label">CLICK SHAPE</span></div>
    <div id="node-editor" style="display:none;">
      <div class="row">
        <div class="row-head"><span>POS X</span><span id="val-px">0.00</span></div>
        <input id="sl-px" type="range" min="-2.50" max="2.50" step="0.05" oninput="updateNodePos()" />
      </div>
      <div class="row">
        <div class="row-head"><span>POS Y</span><span id="val-py">0.00</span></div>
        <input id="sl-py" type="range" min="-0.50" max="2.50" step="0.05" oninput="updateNodePos()" />
      </div>
      <div class="row">
        <div class="row-head"><span>POS Z</span><span id="val-pz">0.00</span></div>
        <input id="sl-pz" type="range" min="-2.50" max="2.50" step="0.05" oninput="updateNodePos()" />
      </div>
      <div class="row">
        <div class="row-head"><span>SIZE</span><span id="val-sx">0.50</span></div>
        <input id="sl-sx" type="range" min="0.10" max="1.50" step="0.02" oninput="updateNodeSize()" />
      </div>
      <div class="row">
        <div class="grid-4">
          <button onclick="setNodeOp(3)">SMIN</button>
          <button onclick="setNodeOp(0)">UNI</button>
          <button onclick="setNodeOp(1)">SUB</button>
          <button onclick="delNode()" style="color:var(--bad);">DEL</button>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="row-head"><span>ADD NODE</span><span>PRIMITIVE</span></div>
      <div class="grid-4">
        <button onclick="addNode(0)">+SPH</button>
        <button onclick="addNode(1)">+BOX</button>
        <button onclick="addNode(2)">+TOR</button>
        <button onclick="addNode(3)">+CAP</button>
      </div>
    </div>
  </div>

  <div class="foot">CLICK PICK · DRAG ORBIT · SCROLL ZOOM · 1-4 SCENE · P INSPECT · V 2D SDF · SPACE PAUSE</div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <script>
    var selectedIdx = -1;

    function setScene(idx, btn) {
      document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      if (typeof Module !== 'undefined' && Module.ccall) Module.ccall('sdf_set_scene', null, ['number'], [idx]);
    }
    function setRes(scale, btn) {
      document.querySelectorAll('.res-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      if (typeof Module !== 'undefined' && Module.ccall) Module.ccall('sdf_set_res_scale', null, ['number'], [scale]);
    }
    function setQual(q, btn) {
      document.querySelectorAll('.qual-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      if (typeof Module !== 'undefined' && Module.ccall) Module.ccall('sdf_set_quality', null, ['number'], [q]);
    }
    function toggle2d(btn) {
      btn.classList.toggle('active');
      if (typeof Module !== 'undefined' && Module.ccall) Module.ccall('sdf_toggle_2d_overlay', null, [], []);
    }
    function togglePause(btn) {
      btn.classList.toggle('active');
      if (typeof Module !== 'undefined' && Module.ccall) Module.ccall('sdf_toggle_pause', null, [], []);
    }
    function toggleParams(btn) {
      btn.classList.toggle('active');
      document.getElementById('params-drawer').classList.toggle('open');
    }
    function resetAll() {
      if (typeof Module !== 'undefined' && Module.ccall) Module.ccall('sdf_reset_camera', null, [], []);
    }
    function setBlend(v) {
      document.getElementById('val-blend').textContent = parseFloat(v).toFixed(2);
      if (typeof Module !== 'undefined' && Module.ccall) Module.ccall('sdf_set_blend', null, ['number'], [parseFloat(v)]);
    }
    function setSpeed(v) {
      document.getElementById('val-speed').textContent = parseFloat(v).toFixed(2);
      if (typeof Module !== 'undefined' && Module.ccall) Module.ccall('sdf_set_speed', null, ['number'], [parseFloat(v)]);
    }
    function setShadow(v) {
      document.getElementById('val-shadow').textContent = parseFloat(v).toFixed(2);
      if (typeof Module !== 'undefined' && Module.ccall) Module.ccall('sdf_set_shadow', null, ['number'], [parseFloat(v)]);
    }
    function setFog(v) {
      document.getElementById('val-fog').textContent = parseFloat(v).toFixed(2);
      if (typeof Module !== 'undefined' && Module.ccall) Module.ccall('sdf_set_fog', null, ['number'], [parseFloat(v) * 0.001]);
    }
    function setOp(op, btn) {
      document.querySelectorAll('.op-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      if (typeof Module !== 'undefined' && Module.ccall) Module.ccall('sdf_set_op_override', null, ['number'], [op]);
    }

    function syncInspector(forceFields) {
      if (typeof Module === 'undefined' || !Module.ccall) return;
      var cnt = Module.ccall('sdf_get_node_count', 'number', [], []);
      document.getElementById('node-count').textContent = cnt + ' NODES';
      var sel = Module.ccall('sdf_get_selected_node', 'number', [], []);
      var changed = (sel !== selectedIdx);
      selectedIdx = sel;

      var editor = document.getElementById('node-editor');
      var lbl = document.getElementById('sel-label');
      if (sel < 0) {
        lbl.textContent = 'CLICK SHAPE';
        editor.style.display = 'none';
        return;
      }
      var names = ['SPHERE', 'BOX', 'TORUS', 'CAPSULE'];
      var kind = Math.round(Module.ccall('sdf_get_node_prop', 'number', ['number', 'number'], [sel, 6]));
      lbl.textContent = '#' + sel + ' ' + (names[kind] || 'NODE');
      editor.style.display = 'block';

      if (changed || forceFields) {
        var px = Module.ccall('sdf_get_node_prop', 'number', ['number', 'number'], [sel, 0]);
        var py = Module.ccall('sdf_get_node_prop', 'number', ['number', 'number'], [sel, 1]);
        var pz = Module.ccall('sdf_get_node_prop', 'number', ['number', 'number'], [sel, 2]);
        var sx = Module.ccall('sdf_get_node_prop', 'number', ['number', 'number'], [sel, 3]);
        document.getElementById('sl-px').value = px;
        document.getElementById('sl-py').value = py;
        document.getElementById('sl-pz').value = pz;
        document.getElementById('sl-sx').value = sx;
        document.getElementById('val-px').textContent = px.toFixed(2);
        document.getElementById('val-py').textContent = py.toFixed(2);
        document.getElementById('val-pz').textContent = pz.toFixed(2);
        document.getElementById('val-sx').textContent = sx.toFixed(2);
      }
    }

    function updateNodePos() {
      if (selectedIdx < 0 || !Module.ccall) return;
      var px = parseFloat(document.getElementById('sl-px').value);
      var py = parseFloat(document.getElementById('sl-py').value);
      var pz = parseFloat(document.getElementById('sl-pz').value);
      document.getElementById('val-px').textContent = px.toFixed(2);
      document.getElementById('val-py').textContent = py.toFixed(2);
      document.getElementById('val-pz').textContent = pz.toFixed(2);
      Module.ccall('sdf_set_node_pos', null, ['number', 'number', 'number', 'number'], [selectedIdx, px, py, pz]);
    }

    function updateNodeSize() {
      if (selectedIdx < 0 || !Module.ccall) return;
      var sx = parseFloat(document.getElementById('sl-sx').value);
      document.getElementById('val-sx').textContent = sx.toFixed(2);
      var sy = Module.ccall('sdf_get_node_prop', 'number', ['number', 'number'], [selectedIdx, 4]);
      var sz = Module.ccall('sdf_get_node_prop', 'number', ['number', 'number'], [selectedIdx, 5]);
      var kind = Math.round(Module.ccall('sdf_get_node_prop', 'number', ['number', 'number'], [selectedIdx, 6]));
      if (kind === 1) { sy = sx; sz = sx; }
      Module.ccall('sdf_set_node_size', null, ['number', 'number', 'number', 'number'], [selectedIdx, sx, sy, sz]);
    }

    function setNodeOp(op) {
      if (selectedIdx >= 0 && Module.ccall) Module.ccall('sdf_set_node_op', null, ['number', 'number'], [selectedIdx, op]);
    }
    function addNode(type) {
      if (Module.ccall) {
        Module.ccall('sdf_add_node', null, ['number'], [type]);
        syncInspector(true);
      }
    }
    function delNode() {
      if (selectedIdx >= 0 && Module.ccall) {
        Module.ccall('sdf_remove_node', null, ['number'], [selectedIdx]);
        syncInspector(true);
      }
    }

    window.addEventListener('keydown', function(e) {
      if (e.key >= '1' && e.key <= '4') {
        var btns = document.querySelectorAll('.scene-btn');
        var idx = parseInt(e.key, 10) - 1;
        document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
        if (btns[idx]) btns[idx].classList.add('active');
      } else if (e.code === 'Space') {
        var pb = document.getElementById('pause-btn');
        if (pb) pb.classList.toggle('active');
      } else if (e.key === 'p' || e.key === 'P') {
        var pr = document.getElementById('params-btn');
        if (pr) toggleParams(pr);
      } else if (e.key === 'v' || e.key === 'V') {
        var h2 = document.getElementById('hud2d-btn');
        if (h2) h2.classList.toggle('active');
      }
    });

    var Module = {
      canvas: document.getElementById('canvas'),
      onRuntimeInitialized: function() {
        setInterval(function() {
          if (Module.ccall) {
            var fps = Module.ccall('sdf_get_fps', 'number', [], []);
            var el = document.getElementById('fps');
            if (el && fps > 0) {
              var ms = (1000.0 / fps).toFixed(1);
              el.textContent = fps.toFixed(1) + ' FPS · ' + ms + 'MS';
              el.style.color = fps >= 50 ? 'var(--ok)' : (fps >= 24 ? 'var(--warn)' : 'var(--bad)');
            }
            syncInspector(false);
          }
        }, 250);
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
